<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Wine Stock Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-stone-950 border border-stone-800 rounded-2xl max-w-md w-full p-8 shadow-2xl">
        <div class="text-center mb-6">
            <span class="text-4xl">🍷</span>
            <h1 class="text-2xl font-bold text-amber-500 mt-2">Wine Cellar Login</h1>
            <p class="text-sm text-stone-400 mt-1">เข้าสู่ระบบเพื่อจัดการสต็อกไวน์</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs text-stone-400 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                <!-- เปลี่ยน placeholder ไม่ให้ใบ้ชื่อ admin/staff ด้วย -->
                <input type="text" id="username" required class="w-full bg-stone-900 border border-stone-700 rounded-lg p-3 text-sm text-stone-100 focus:outline-none focus:border-amber-500" placeholder="ชื่อผู้ใช้งาน">
            </div>
            <div>
                <label class="block text-xs text-stone-400 mb-1">รหัสผ่าน (Password)</label>
                <input type="password" id="password" required class="w-full bg-stone-900 border border-stone-700 rounded-lg p-3 text-sm text-stone-100 focus:outline-none focus:border-amber-500" placeholder="••••••••">
            </div>
            <p id="error-msg" class="text-red-400 text-xs text-center hidden">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</p>
            
            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium p-3 rounded-lg text-sm transition mt-4">
                เข้าสู่ระบบ
            </button>
        </form>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userRole', result.role);
                    localStorage.setItem('userName', result.name);
                    window.location.href = '/menu.html';
                } else {
                    errorMsg.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Login error:', error);
            }
        }
    </script>
</body>
</html>
