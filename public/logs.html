<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการใช้งาน - Wine Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen flex flex-col">

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = '/login.html';
    </script>

    <header class="bg-stone-950 border-b border-stone-800 py-4 px-6 flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center space-x-4">
            <a href="/menu.html" class="bg-stone-800 hover:bg-stone-700 text-stone-300 px-3 py-1.5 rounded-lg text-sm transition">⬅️ กลับเมนูหลัก</a>
            <h1 class="text-xl font-semibold text-sky-400 hidden sm:block">📝 ประวัติการใช้งานระบบ (Logs)</h1>
        </div>
        <div class="flex items-center space-x-4">
            <span id="user-display" class="text-sm text-stone-300 bg-stone-900 px-3 py-1 rounded-lg border border-stone-800"></span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto py-8 w-full px-4 flex-grow">
        <div class="bg-stone-950 rounded-xl border border-stone-800 overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead>
                        <tr class="bg-stone-900 text-stone-400 text-xs uppercase tracking-wider border-b border-stone-800 text-center">
                            <th class="p-4 text-left w-48">วัน-เวลา</th>
                            <th class="p-4 w-48">ผู้ทำรายการ</th>
                            <th class="p-4 w-48">ประเภทรายการ</th>
                            <th class="p-4 text-left">รายละเอียด</th>
                        </tr>
                    </thead>
                    <tbody id="logs-table-body" class="divide-y divide-stone-800 text-sm">
                        <!-- ข้อมูลจะถูกนำมาแสดงตรงนี้ -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('user-display').innerText = `👤 ${localStorage.getItem('userName')}`;

        async function fetchLogs() {
            try {
                console.log("กำลังดึงข้อมูล Log..."); // เช็คใน Console
                const res = await fetch('/api/logs?t=' + new Date().getTime());
                const logs = await res.json();
                
                console.log("ข้อมูลที่ได้จากเซิร์ฟเวอร์:", logs); // เช็คว่าได้ข้อมูลมาไหม
                
                const tbody = document.getElementById('logs-table-body'); 
                if (!tbody) {
                    console.error("หาตารางไม่เจอ!");
                    return;
                }
                
                tbody.innerHTML = ''; 
                
                if (logs.length === 0) {
                     tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-stone-500">ยังไม่มีประวัติการใช้งาน</td></tr>`;
                     return;
                }
                
                logs.forEach(log => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-stone-900/50 transition text-center';
                    
                    tr.innerHTML = `
                        <td class="p-4 text-left text-stone-400">${log.timestamp || '-'}</td>
                        <td class="p-4 text-emerald-400 font-semibold">${log.user || '-'}</td>
                        <td class="p-4 text-amber-500">${log.action || '-'}</td>
                        <td class="p-4 text-stone-200 text-left font-mono text-xs">${log.details || '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("เกิดข้อผิดพลาดในการดึงข้อมูล:", error);
                const tbody = document.getElementById('logs-table-body'); 
                if(tbody) tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">❌ ไม่สามารถดึงข้อมูลประวัติได้</td></tr>`;
            }
        }

        fetchLogs();
        setInterval(fetchLogs, 5000);
    </script>
</body>
</html>
