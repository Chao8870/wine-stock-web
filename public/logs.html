<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการใช้งาน - Wine Stock Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen">

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = '/login.html';
    </script>

    <header class="bg-stone-950 border-b border-stone-800 py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-4">
            <a href="/menu.html" class="bg-stone-800 hover:bg-stone-700 text-stone-300 px-3 py-1.5 rounded-lg text-sm transition">⬅ ย้อนกลับ</a>
            <h1 class="text-xl font-semibold text-amber-500 hidden sm:block">ประวัติการใช้งาน (System Logs)</h1>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
        <div class="bg-stone-950 border border-stone-800 rounded-2xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-stone-300">
                    <thead class="text-xs text-stone-400 uppercase bg-stone-900/50 border-b border-stone-800">
                        <tr>
                            <th class="px-6 py-4">วัน-เวลา</th>
                            <th class="px-6 py-4">ผู้ใช้งาน</th>
                            <th class="px-6 py-4">การกระทำ (Action)</th>
                            <th class="px-6 py-4">รายละเอียด</th>
                        </tr>
                    </thead>
                    <tbody id="logs-table-body">
                        <!-- ข้อมูล Logs จะมาแทรกตรงนี้ -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        async function fetchLogs() {
            try {
                const response = await fetch('/api/logs?t=' + new Date().getTime());
                const logs = await response.json();
                const tbody = document.getElementById('logs-table-body');
                
                if (logs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-stone-500">ยังไม่มีประวัติการใช้งาน</td></tr>`;
                    return;
                }

                logs.forEach(log => {
                    let actionColor = 'text-stone-300';
                    if (log.action.includes('นำเข้า') || log.action.includes('เพิ่ม')) actionColor = 'text-emerald-400 font-semibold';
                    if (log.action.includes('ตัดสต็อก')) actionColor = 'text-red-400 font-semibold';

                    const tr = document.createElement('tr');
                    tr.className = 'border-b border-stone-800/50 hover:bg-stone-900/30 transition';
                    tr.innerHTML = `
                        <td class="px-6 py-4 text-xs text-stone-400">${log.time}</td>
                        <td class="px-6 py-4 text-amber-500 font-medium">${log.username}</td>
                        <td class="px-6 py-4 ${actionColor}">${log.action}</td>
                        <td class="px-6 py-4">${log.detail}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error fetching logs:', error);
            }
        }
        fetchLogs();
    </script>
</body>
</html>
