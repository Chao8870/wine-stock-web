<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สแกนรับเข้า-เบิกออก - Wine Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library สำหรับเปิดกล้องสแกน QR/Barcode -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Prompt', sans-serif; } 
        /* ปรับแต่งกรอบกล้องให้เข้ากับ Dark Mode */
        #reader { width: 100%; border-radius: 12px; border: 2px solid #444 !important; overflow: hidden; background: #000; }
        #reader video { object-fit: cover; }
    </style>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen flex flex-col">

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = '/login.html';
        const userRole = localStorage.getItem('userRole');
        if (userRole === 'viewer') {
            alert('สิทธิ์ Demo ไม่สามารถปรับสต็อกได้ครับ');
            window.location.href = '/menu.html';
        }
    </script>

    <header class="bg-stone-950 border-b border-stone-800 py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-4">
            <a href="/menu.html" class="bg-stone-800 hover:bg-stone-700 text-stone-300 px-3 py-1.5 rounded-lg text-sm transition">⬅ ย้อนกลับ</a>
            <h1 class="text-xl font-semibold text-emerald-500 hidden sm:block">📷 สแกนบันทึกรายการ (QR / Barcode)</h1>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-stone-950 border border-stone-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
            
            <!-- ตั้งค่าการสแกน -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-xs text-stone-400 mb-1">ประเภทรายการ</label>
                    <select id="scan-action" class="w-full bg-stone-900 border border-stone-700 rounded-lg p-3 text-sm text-stone-100 focus:outline-none focus:border-emerald-500">
                        <option value="in">📥 นำเข้าสต็อก (Stock In)</option>
                        <option value="out">📤 เบิกออก (Stock Out)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-stone-400 mb-1">ตำแหน่งเก็บ</label>
                    <select id="scan-location" class="w-full bg-stone-900 border border-stone-700 rounded-lg p-3 text-sm text-stone-100 focus:outline-none focus:border-emerald-500">
                        <option value="qty_front">หน้าร้าน</option>
                        <option value="qty_back">หลังร้าน</option>
                        <option value="qty_home">บ้าน</option>
                    </select>
                </div>
            </div>

            <!-- กล้องสแกนมือถือ -->
            <div id="reader" class="mb-4"></div>
            
            <div id="scan-result" class="text-center h-8 text-sm font-semibold mb-4 text-emerald-400">
                พร้อมสแกน... นำกล้องส่องที่บาร์โค้ดได้เลย
            </div>

            <!-- สำหรับปืนยิงบาร์โค้ด หรือ พิมพ์รหัสเอง -->
            <div class="mt-4 pt-4 border-t border-stone-800">
                <label class="block text-xs text-stone-400 mb-2">ใช้ปืนยิงบาร์โค้ด หรือพิมพ์รหัสที่นี่:</label>
                <input type="text" id="manual-barcode" onkeypress="handleManualScan(event)" placeholder="สแกนบาร์โค้ดที่นี่..." class="w-full bg-stone-900 border border-stone-700 rounded-lg p-3 text-sm text-stone-100 focus:outline-none focus:border-emerald-500" autofocus>
            </div>
            
        </div>
    </main>

    <script>
        let wines = [];
        let isProcessing = false; // ป้องกันการสแกนซ้ำรัวๆ
        const userName = localStorage.getItem('userName');

        // ดึงข้อมูลไวน์มาเตรียมไว้เทียบรหัส
        async function fetchWines() {
            try {
                const res = await fetch('/api/wines?t=' + new Date().getTime());
                wines = await res.json();
            } catch (error) {
                console.error('Error fetching wines:', error);
            }
        }
        fetchWines();

        // ฟังก์ชันประมวลผลเมื่อสแกนเจอ
        async function processBarcode(scannedCode) {
            if (isProcessing) return;
            isProcessing = true;

            const resultDiv = document.getElementById('scan-result');
            // ค้นหาไวน์จาก Barcode หรือ รหัส ID (W00001)
            const wine = wines.find(w => w.barcode === scannedCode || w.id === scannedCode);

            if (!wine) {
                resultDiv.innerHTML = `<span class="text-red-500">❌ ไม่พบสินค้า: ${scannedCode}</span>`;
                playSound('error');
                setTimeout(() => { isProcessing = false; resultDiv.innerText = "พร้อมสแกน..."; }, 2000);
                return;
            }

            const action = document.getElementById('scan-action').value;
            const location = document.getElementById('scan-location').value;
            const amount = action === 'in' ? 1 : -1;

            // --- เช็คสต็อกคงเหลือก่อนเบิกออก ---
            if (action === 'out' && wine[location] <= 0) {
                const locName = location === 'qty_front' ? 'หน้าร้าน' : (location === 'qty_back' ? 'หลังร้าน' : 'บ้าน');
                resultDiv.innerHTML = `<span class="text-red-500">❌ เบิกไม่ได้! สต็อก ${wine.name} ใน${locName} เป็น 0</span>`;
                playSound('error');
                
                // หน่วงเวลาให้เห็นข้อความเตือน แล้วกลับไปรอสแกนใหม่
                setTimeout(() => { 
                    isProcessing = false; 
                    resultDiv.innerText = "พร้อมสแกนขวดต่อไป..."; 
                    document.getElementById('manual-barcode').value = '';
                    document.getElementById('manual-barcode').focus();
                }, 2500);
                return; // หยุดการทำงาน ไม่ส่งข้อมูลไปบันทึก
            }

            try {
                const response = await fetch(`/api/wines/${wine.id}/qty`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ location, amount, user: userName })
                });

                if (response.ok) {
                    // อัปเดตสต็อกในตัวแปรทันที เพื่อให้สแกนขวดเดิมซ้ำได้อย่างแม่นยำ
                    wine[location] += amount;

                    const actionText = action === 'in' ? 'รับเข้า' : 'เบิกออก';
                    resultDiv.innerHTML = `✅ ${actionText} <b>${wine.name}</b> สำเร็จ! (คงเหลือ ${wine[location]})`;
                    playSound('success');
                } else {
                    resultDiv.innerHTML = `<span class="text-red-500">❌ เกิดข้อผิดพลาดในการบันทึก</span>`;
                    playSound('error');
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="text-red-500">❌ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</span>`;
            }

            // หน่วงเวลา 2 วินาทีเพื่อให้คนสแกนเห็นผลลัพธ์ ก่อนเปิดรับสแกนขวดต่อไป
            setTimeout(() => { 
                isProcessing = false; 
                resultDiv.innerText = "พร้อมสแกนขวดต่อไป..."; 
                document.getElementById('manual-barcode').value = '';
                document.getElementById('manual-barcode').focus();
            }, 2000);
        }

        // รองรับปืนยิงบาร์โค้ด (เมื่อกด Enter)
        function handleManualScan(event) {
            if (event.key === 'Enter') {
                const val = event.target.value.trim();
                if (val) processBarcode(val);
            }
        }

        // เสียงแจ้งเตือน
        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            if (type === 'success') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } else {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            }
        }

        // เปิดกล้องมือถือ
        function onScanSuccess(decodedText) {
            processBarcode(decodedText);
        }
        
        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
