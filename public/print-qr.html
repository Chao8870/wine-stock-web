<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พิมพ์ QR Code สินค้า - Wine Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library สำหรับสร้าง QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        
        /* ตั้งค่า CSS เฉพาะสำหรับการสั่งพิมพ์ (Print) */
        @media print {
            @page { margin: 10mm; } /* ขอบกระดาษตอนพิมพ์ */
            body { background-color: white !important; color: black !important; }
            .no-print { display: none !important; } /* ซ่อนเมนูและปุ่มตอนพิมพ์ */
            
            /* จัด Layout ให้เป็น Grid สำหรับแผ่นสติ๊กเกอร์ */
            .print-grid { 
                display: grid !important; 
                grid-template-columns: repeat(4, 1fr) !important; /* พิมพ์ 4 ดวงต่อแถว */
                gap: 15px !important; 
            }
            .qr-card { 
                border: 1px dashed #ccc !important; 
                page-break-inside: avoid; /* ป้องกันการโดนตัดครึ่งหน้า */
                break-inside: avoid;
            }
        }
    </style>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen p-6">

    <!-- ส่วนหัวและปุ่มควบคุม (จะถูกซ่อนตอนสั่งพิมพ์ด้วยคลาส no-print) -->
    <div class="no-print max-w-6xl mx-auto mb-6 bg-stone-950 p-4 rounded-xl border border-stone-800 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center space-x-4">
            <a href="/menu.html" class="bg-stone-800 hover:bg-stone-700 text-stone-300 px-4 py-2 rounded-lg text-sm transition">⬅ ย้อนกลับเมนู</a>
            <h1 class="text-xl font-semibold text-amber-500">🖨️ สร้างและพิมพ์ QR Code</h1>
        </div>
        
        <div class="flex w-full sm:w-auto items-center space-x-2">
            <input type="text" id="search-input" onkeyup="filterQR()" placeholder="ค้นหารหัส หรือชื่อไวน์..." class="bg-stone-900 border border-stone-700 text-stone-100 px-4 py-2 rounded-lg text-sm w-full sm:w-64 focus:outline-none focus:border-amber-500">
            <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg text-sm font-semibold transition shadow-lg shadow-emerald-500/20 whitespace-nowrap">
                🖨️ สั่งพิมพ์
            </button>
        </div>
    </div>

    <!-- พื้นที่แสดง QR Code (จะถูกพิมพ์) -->
    <div id="qr-container" class="max-w-6xl mx-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 print-grid">
        <!-- QR Code จะถูกโหลดมาใส่ตรงนี้ -->
    </div>

    <script>
        let wines = [];

        async function fetchWines() {
            try {
                const res = await fetch('/api/wines');
                wines = await res.json();
                renderQRCodes(wines);
            } catch (error) {
                console.error('Error fetching wines:', error);
            }
        }

        function renderQRCodes(dataToRender) {
            const container = document.getElementById('qr-container');
            container.innerHTML = ''; // ล้างข้อมูลเก่าก่อน

            dataToRender.forEach(wine => {
                // สร้างการ์ดกรอบ QR Code
                const card = document.createElement('div');
                // ใช้พื้นหลังขาวเพื่อให้ QR Code อ่านง่ายเสมอแม้ในโหมดมืด
                card.className = 'qr-card bg-white text-black border border-stone-300 rounded-xl p-3 flex flex-col items-center justify-center text-center';

                // กล่องสำหรับใส่รูป QR
                const qrDiv = document.createElement('div');
                qrDiv.className = 'mb-2 flex justify-center';
                
                // ข้อมูลใต้ QR Code
                const infoDiv = document.createElement('div');
                infoDiv.className = 'w-full';
                infoDiv.innerHTML = `
                    <div class="font-bold text-sm text-stone-900">${wine.id}</div>
                    <div class="text-[10px] text-stone-500 truncate w-full" title="${wine.name}">${wine.name}</div>
                    <div class="text-[10px] text-stone-400 mt-1">${wine.barcode}</div>
                `;

                card.appendChild(qrDiv);
                card.appendChild(infoDiv);
                container.appendChild(card);

                // สร้างรูป QR Code ฝังลงใน qrDiv
                // ใช้ Barcode เป็นข้อมูลสแกน (ตรงกับเงื่อนไขใน scan.html)
                new QRCode(qrDiv, {
                    text: wine.barcode || wine.id, 
                    width: 120,
                    height: 120,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.M
                });
            });
        }

        // ฟังก์ชันค้นหาเพื่อให้เลือกพิมพ์เฉพาะรายการที่ต้องการได้ง่ายๆ
        function filterQR() {
            const kw = document.getElementById('search-input').value.toLowerCase();
            const filtered = wines.filter(w => 
                w.barcode.toLowerCase().includes(kw) || 
                w.id.toLowerCase().includes(kw) || 
                w.name.toLowerCase().includes(kw)
            );
            renderQRCodes(filtered);
        }

        fetchWines();
    </script>
</body>
</html>
