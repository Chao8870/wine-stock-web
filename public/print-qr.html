<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พิมพ์ QR Code สินค้า - Wine Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library สำหรับสร้าง QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        
        /* ตั้งค่า CSS เฉพาะสำหรับการสั่งพิมพ์ (Print) */
        @media print {
            @page { margin: 3mm; } 
            body { background-color: white !important; color: black !important; padding: 0 !important; }
            .no-print { display: none !important; } 
            
            /* จัด Layout ให้เป็น Grid สำหรับแผ่นสติ๊กเกอร์ */
            .print-grid { 
                display: grid !important; 
                grid-template-columns: repeat(7, 1fr) !important; 
                gap: 3px !important; 
            }
            .qr-card { 
                border: 1px dashed #ccc !important; 
                page-break-inside: avoid; 
                break-inside: avoid;
                width: 100% !important;
            }
        }
    </style>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen p-6">

    <div class="no-print max-w-7xl mx-auto mb-6 bg-stone-950 p-4 rounded-xl border border-stone-800 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center space-x-4">
            <a href="/menu.html" class="bg-stone-800 hover:bg-stone-700 text-stone-300 px-4 py-2 rounded-lg text-sm transition">⬅ ย้อนกลับ</a>
            <h1 class="text-xl font-semibold text-amber-500">🖨️ พิมพ์ QR Code</h1>
        </div>
        
        <!-- ห่อกล่องค้นหาและข้อความแนะนำไว้ด้วยกัน -->
        <div class="flex flex-col w-full sm:w-auto gap-2">
            <div class="flex w-full sm:w-auto items-center space-x-2 overflow-x-auto">
                <!-- ช่องค้นหา -->
                <input type="text" id="search-input" onkeyup="filterQR()" placeholder="ค้นหารหัส หรือชื่อไวน์..." class="bg-stone-900 border border-stone-700 text-stone-100 px-4 py-2 rounded-lg text-sm w-full sm:w-48 focus:outline-none focus:border-amber-500">
                
                <!-- ช่องระบุจำนวนดวง -->
                <div class="flex items-center bg-stone-900 border border-stone-700 rounded-lg px-3 py-1.5" title="ค้นหาสินค้าให้เจอ 1 รายการก่อน แล้วพิมพ์จำนวนที่ต้องการพิมพ์ซ้ำ">
                    <span class="text-sm text-stone-400 whitespace-nowrap mr-2">จำนวนสำเนา:</span>
                    <input type="number" id="print-qty" value="1" min="1" onchange="filterQR()" onkeyup="filterQR()" class="bg-transparent text-amber-400 font-bold w-12 focus:outline-none text-center">
                </div>

                <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg text-sm font-semibold transition shadow-lg shadow-emerald-500/20 whitespace-nowrap">
                    🖨️ สั่งพิมพ์
                </button>
            </div>
            
            <!-- 💡 เพิ่มข้อความแนะนำที่นี่ -->
            <p class="text-xs text-amber-400/80 pl-1">
                💡 กรณีต้องการพิมพ์รหัสเดียว ใส่รหัสที่ต้องการในช่องค้นหา และใส่จำนวนสำเนา = 70
            </p>
        </div>
    </div>
    <!-- พื้นที่แสดง QR Code -->
    <div id="qr-container" class="max-w-6xl mx-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 print-grid">
        <!-- QR Code จะถูกโหลดมาใส่ตรงนี้ -->
    </div>

    <script>
        let wines = [];

        async function fetchWines() {
            try {
                const res = await fetch('/api/wines');
                wines = await res.json();
                renderQRCodes(wines);
            } catch (error) {
                console.error('Error fetching wines:', error);
            }
        }

        function renderQRCodes(dataToRender) {
            const container = document.getElementById('qr-container');
            container.innerHTML = ''; 

            // 💡 ดึงค่าจำนวนสำเนาที่ต้องการพิมพ์ (ค่าเริ่มต้นคือ 1)
            const qty = parseInt(document.getElementById('print-qty').value) || 1;

            dataToRender.forEach(wine => {
                const qrText = wine.barcode || wine.id;
                if (!qrText) return;

                // 💡 วนลูปสร้างการ์ดตามจำนวนที่ระบุ (qty)
                for (let i = 0; i < qty; i++) {
                    const card = document.createElement('div');
                    card.className = 'qr-card bg-white text-black border border-stone-300 rounded-lg p-1 flex flex-col items-center justify-center text-center relative overflow-hidden h-[90px]';

                    // ส่วนชื่อไวน์
                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'absolute left-0.5 top-1 bottom-1 flex items-center justify-center text-[7.5px] text-stone-600 font-medium overflow-hidden';
                    nameDiv.style.writingMode = 'vertical-rl';
                    nameDiv.style.transform = 'scale(-1)'; 
                    nameDiv.textContent = wine.name || 'Unknown'; 

                    // ส่วนเนื้อหาหลัก 
                    const mainInfoDiv = document.createElement('div');
                    mainInfoDiv.className = 'flex flex-col items-center justify-center w-full pl-3';

                    const qrDiv = document.createElement('div');
                    qrDiv.className = 'mb-1 flex justify-center';
                    
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'w-full';
                    infoDiv.innerHTML = `
                        <div class="font-bold text-[11px] text-stone-900 leading-none mb-0.5">${wine.id || '-'}</div>
                        <div class="text-[9px] text-stone-500 leading-none">${wine.barcode || '-'}</div>
                    `;

                    mainInfoDiv.appendChild(qrDiv);
                    mainInfoDiv.appendChild(infoDiv);

                    card.appendChild(nameDiv);
                    card.appendChild(mainInfoDiv);
                    container.appendChild(card);

                    // สร้างรูป QR Code 
                    try {
                        new QRCode(qrDiv, {
                            text: qrText, 
                            width: 60,   
                            height: 60,  
                            colorDark : "#000000",
                            colorLight : "#ffffff",
                            correctLevel : QRCode.CorrectLevel.M
                        });
                    } catch(e) {
                        console.error('QR Generate Error:', e);
                    }
                }
            });
        }

        function filterQR() {
            const kw = document.getElementById('search-input').value.toLowerCase();
            const filtered = wines.filter(w => 
                (w.barcode && w.barcode.toLowerCase().includes(kw)) || 
                (w.id && w.id.toLowerCase().includes(kw)) || 
                (w.name && w.name.toLowerCase().includes(kw))
            );
            renderQRCodes(filtered);
        }

        fetchWines();

        // ==========================================
        // ระบบ Auto Logout
        // ==========================================
        let inactivityTimer;
        const TIME_LIMIT = 30 * 60 * 1000; 

        function autoLogout() {
            alert("คุณไม่ได้ใช้งานระบบเป็นเวลานาน ระบบจึงออกจากระบบอัตโนมัติเพื่อความปลอดภัย");
            localStorage.clear(); 
            window.location.href = '/login.html'; 
        }

        function resetTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(autoLogout, TIME_LIMIT);
        }

        window.onload = resetTimer;
        document.onmousemove = resetTimer;    
        document.onkeypress = resetTimer;     
        document.ontouchstart = resetTimer;   
        document.onclick = resetTimer;        
        document.onscroll = resetTimer;       
    </script>
</body>
</html>
