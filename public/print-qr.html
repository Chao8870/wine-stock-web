<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พิมพ์ QR Code สินค้า - Wine Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library สำหรับสร้าง QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        
        /* ตั้งค่า CSS เฉพาะสำหรับการสั่งพิมพ์ (Print) */
        @media print {
            @page { margin: 3mm; } /* ลดขอบกระดาษซ้าย-ขวาให้ชิดขอบที่สุด */
            body { 
                background-color: white !important; 
                color: black !important; 
                padding: 0 !important; 
            }
            .no-print { display: none !important; } 
            
            /* จัด Layout ให้เป็น Grid สำหรับแผ่นสติ๊กเกอร์ */
            .print-grid { 
                display: grid !important; 
                grid-template-columns: repeat(7, 1fr) !important; /* พิมพ์ 7 ดวงต่อแถว */
                gap: 3px !important; /* ลดระยะห่างซ้าย-ขวา */
            }
            .qr-card { 
                border: 1px dashed #ccc !important; 
                page-break-inside: avoid; 
                break-inside: avoid;
                width: 100% !important;
            }
        }
    </style>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen p-6">

    <!-- ส่วนหัวและปุ่มควบคุม -->
    <div class="no-print max-w-6xl mx-auto mb-6 bg-stone-950 p-4 rounded-xl border border-stone-800 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center space-x-4">
            <a href="/menu.html" class="bg-stone-800 hover:bg-stone-700 text-stone-300 px-4 py-2 rounded-lg text-sm transition">⬅ ย้อนกลับเมนู</a>
            <h1 class="text-xl font-semibold text-amber-500">🖨️ สร้างและพิมพ์ QR Code</h1>
        </div>
        
        <div class="flex w-full sm:w-auto items-center space-x-2">
            <input type="text" id="search-input" onkeyup="filterQR()" placeholder="ค้นหารหัส หรือชื่อไวน์..." class="bg-stone-900 border border-stone-700 text-stone-100 px-4 py-2 rounded-lg text-sm w-full sm:w-64 focus:outline-none focus:border-amber-500">
            <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg text-sm font-semibold transition shadow-lg shadow-emerald-500/20 whitespace-nowrap">
                🖨️ สั่งพิมพ์
            </button>
        </div>
    </div>

    <!-- พื้นที่แสดง QR Code -->
    <div id="qr-container" class="max-w-6xl mx-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 print-grid">
        <!-- QR Code จะถูกโหลดมาใส่ตรงนี้ -->
    </div>

    <script>
        let wines = [];

        async function fetchWines() {
            try {
                const res = await fetch('/api/wines');
                wines = await res.json();
                renderQRCodes(wines);
            } catch (error) {
                console.error('Error fetching wines:', error);
            }
        }

        function renderQRCodes(dataToRender) {
            const container = document.getElementById('qr-container');
            container.innerHTML = ''; 

            dataToRender.forEach(wine => {
                // ข้ามการสร้าง QR ถ้ารายการนี้ไม่มีรหัสใดๆ เลย
                const qrText = wine.barcode || wine.id;
                if (!qrText) return; // 💡 ป้องกัน Error ถ้าข้อมูลว่าง

                const card = document.createElement('div');
                card.className = 'qr-card bg-white text-black border border-stone-300 rounded-lg p-1 flex flex-col items-center justify-center text-center relative overflow-hidden h-[90px]';

                // ส่วนชื่อไวน์ วางแนวตั้งชิดซ้าย
                const nameDiv = document.createElement('div');
                nameDiv.className = 'absolute left-0.5 top-1 bottom-1 flex items-center justify-center text-[7px] text-stone-600 font-medium overflow-hidden';
                nameDiv.style.writingMode = 'vertical-rl';
                nameDiv.style.transform = 'scale(-1)'; 
                nameDiv.textContent = wine.name || 'Unknown'; // เผื่อกรณีไม่มีชื่อ

                // ส่วนข้อมูลหลัก (QR, ID, Barcode) 
                const mainInfoDiv = document.createElement('div');
                mainInfoDiv.className = 'flex flex-col items-center justify-center w-full pl-3'; 

                // กล่องสำหรับใส่รูป QR
                const qrDiv = document.createElement('div');
                qrDiv.className = 'mb-1 flex justify-center';
                
                // ข้อมูล ID และ Barcode
                const infoDiv = document.createElement('div');
                infoDiv.className = 'w-full';
                infoDiv.innerHTML = `
                    <div class="font-bold text-[10px] text-stone-900 leading-none mb-0.5">${wine.id || '-'}</div>
                    <div class="text-[8px] text-stone-400 leading-none">${wine.barcode || '-'}</div>
                `;

                // ประกอบข้อมูล
                mainInfoDiv.appendChild(qrDiv);
                mainInfoDiv.appendChild(infoDiv);

                card.appendChild(nameDiv);
                card.appendChild(mainInfoDiv);
                container.appendChild(card);
                
                // 💡 ป้องกัน Error ตอนสร้าง QR Code
                try {
                    new QRCode(qrDiv, {
                        text: qrText, 
                        width: 55,   
                        height: 55,  
                        colorDark : "#000000",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.M
                    });
                } catch (e) {
                    console.error("สร้าง QR Code ไม่สำเร็จสำหรับ:", qrText, e);
                    qrDiv.innerHTML = '<span class="text-xs text-red-500">Error</span>';
                }
            });
        }
                
                // สร้างรูป QR Code 
                new QRCode(qrDiv, {
                    text: wine.barcode || wine.id, 
                    width: 55,   
                    height: 55,  
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.M
                });
            });
        }

        function filterQR() {
            const kw = document.getElementById('search-input').value.toLowerCase();
            const filtered = wines.filter(w => 
                w.barcode.toLowerCase().includes(kw) || 
                w.id.toLowerCase().includes(kw) || 
                w.name.toLowerCase().includes(kw)
            );
            renderQRCodes(filtered);
        }

        fetchWines();

        // ==========================================
        // ระบบ Auto Logout
        // ==========================================
        let inactivityTimer;
        const TIME_LIMIT = 30 *
