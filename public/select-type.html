<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือกประเภทไวน์ - Wine Stock Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen">

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = '/login.html';
    </script>

    <header class="bg-stone-950 border-b border-stone-800 py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-4">
            <a href="/menu.html" class="bg-stone-800 hover:bg-stone-700 text-stone-300 px-3 py-1.5 rounded-lg text-sm transition">⬅️ กลับเมนูหลัก</a>
            <h1 class="text-xl font-semibold text-amber-500 hidden sm:block">เลือกประเภทสินค้า</h1>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-16">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-stone-100">เลือกประเภทไวน์</h2>
            <p class="text-stone-400 mt-2">กรุณาเลือกประเภทของไวน์ที่ต้องการเพิ่มเข้าระบบ</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- ปุ่ม Red Wine -->
            <a href="/add-product.html?type=Red" class="bg-stone-950 border border-stone-800 hover:border-red-500 hover:shadow-[0_0_15px_rgba(239,68,68,0.2)] rounded-2xl p-10 flex flex-col items-center justify-center transition group">
                <span class="text-6xl mb-4 group-hover:scale-110 transition">🍷</span>
                <h3 class="text-2xl font-bold text-red-500">Red Wine</h3>
                <p class="text-sm text-stone-400 mt-2">ไวน์แดง</p>
            </a>

            <!-- ปุ่ม White Wine -->
            <a href="/add-product.html?type=White" class="bg-stone-950 border border-stone-800 hover:border-amber-200 hover:shadow-[0_0_15px_rgba(253,230,138,0.2)] rounded-2xl p-10 flex flex-col items-center justify-center transition group">
                <span class="text-6xl mb-4 group-hover:scale-110 transition">🥂</span>
                <h3 class="text-2xl font-bold text-amber-200">White Wine</h3>
                <p class="text-sm text-stone-400 mt-2">ไวน์ขาว</p>
            </a>
        </div>
    </main>

</body>
</html>
